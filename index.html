<!doctype html>
<html lang="pt-BR" data-theme="dark">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Órbita Design System</title>
    <meta name="description" content="Órbita — tokens, tipografia, ícones e componentes para produtos refinados." />
    <meta name="theme-color" content="#0f0e0c" />
    <link rel="icon" href="assets/favicon.svg" type="image/svg+xml" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400..700&family=Inter+Tight:wght@500..800&family=JetBrains+Mono:wght@400..600&display=swap" />

    <script>
      // aplica tema e estado da sidebar antes do primeiro paint (sem "piscar")
      try {
        var t = localStorage.getItem('ds-theme');
        if (t === 'light' || t === 'dark' || t === 'system') document.documentElement.dataset.theme = t;
      } catch (e) {}
    </script>

    <link rel="stylesheet" href="ds/ds.css" />
    <link rel="stylesheet" href="site/site.css" />
    <link rel="stylesheet" href="site/docs.css" />
    <script type="module" src="site/app.js"></script>
  </head>
  <body>
    <a class="ds-skip-link" href="#conteudo" data-skip-link>Pular para o conteúdo</a>

    <div class="ds-shell" id="shell">
      <script>
        try {
          var s = JSON.parse(localStorage.getItem('ds-sidebar'));
          if (s) document.getElementById('shell').dataset.sidebar = s;
        } catch (e) {}
      </script>

      <aside class="ds-sidebar" id="sidebar" aria-label="Barra lateral">
        <div class="ds-sidebar__header">
          <a class="ds-brand" href="#/" aria-label="Órbita, ir para o início">Órbita</a>
          <button type="button" class="ds-icon-btn ds-icon-btn--outline ds-icon-btn--lg ds-sidebar__toggle" data-shell-toggle aria-controls="sidebar" data-ds-tooltip-placement="right">
            <ds-icon name="panel-left" class="ds-sidebar__toggle-collapse"></ds-icon>
            <ds-icon name="x" class="ds-sidebar__toggle-close"></ds-icon>
          </button>
        </div>

        <div class="ds-sidebar__search">
          <button type="button" class="ds-field ds-sidebar-search" data-command-open data-ds-tooltip="Buscar" data-ds-tooltip-placement="right" aria-keyshortcuts="Meta+K Control+K">
            <ds-icon name="search" size="20"></ds-icon>
            <span class="ds-field__placeholder">Buscar no Órbita</span>
            <span class="ds-sidebar-search__kbd" aria-hidden="true"><kbd class="ds-kbd" data-kbd-mod>⌘</kbd><kbd class="ds-kbd">K</kbd></span>
          </button>
        </div>

        <nav class="ds-sidebar__nav" id="sidebar-nav" aria-label="Principal"></nav>

        <div class="ds-sidebar__footer">
          <a class="ds-account" href="#/novidades" data-ds-tooltip="Órbita 0.2 · novidades" data-ds-tooltip-placement="right">
            <span class="ds-avatar"><ds-icon name="package" size="20"></ds-icon></span>
            <span class="ds-account__text">
              <span class="ds-account__title">Órbita 0.2</span>
              <span class="ds-account__subtitle">Ver o que há de novo</span>
            </span>
            <ds-icon name="chevron-right" class="ds-account__chevron"></ds-icon>
          </a>
        </div>
      </aside>

      <div class="ds-shell__scrim" data-shell-scrim></div>

      <div class="ds-main">
        <div class="ds-main__scroll" id="main-scroll">
          <header class="ds-topbar">
            <button type="button" class="ds-icon-btn ds-icon-btn--outline ds-topbar__menu" data-shell-toggle aria-controls="sidebar">
              <ds-icon name="menu"></ds-icon>
            </button>
            <nav class="ds-breadcrumb" id="breadcrumb" aria-label="Você está em"></nav>
            <div class="ds-topbar__spacer"></div>
            <button type="button" class="ds-icon-btn ds-topbar__search" data-command-open aria-label="Buscar">
              <ds-icon name="search"></ds-icon>
            </button>
            <div class="ds-segmented" role="radiogroup" aria-label="Tema">
              <button type="button" class="ds-segmented__item" role="radio" data-theme-option="dark" aria-label="Escuro" data-ds-tooltip="Tema escuro" data-ds-tooltip-placement="bottom"><ds-icon name="moon" size="16"></ds-icon></button>
              <button type="button" class="ds-segmented__item" role="radio" data-theme-option="light" aria-label="Claro" data-ds-tooltip="Tema claro" data-ds-tooltip-placement="bottom"><ds-icon name="sun" size="16"></ds-icon></button>
              <button type="button" class="ds-segmented__item" role="radio" data-theme-option="system" aria-label="Sistema" data-ds-tooltip="Seguir o sistema" data-ds-tooltip-placement="bottom"><ds-icon name="monitor" size="16"></ds-icon></button>
            </div>
          </header>

          <main id="conteudo" class="ds-main__content" tabindex="-1"></main>
        </div>
      </div>
    </div>
  </body>
</html>
