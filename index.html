<!doctype html>
<html lang="pt-BR" data-theme="dark">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Lume Design System</title>
    <meta name="description" content="Lume — tokens, tipografia, ícones e componentes para produtos refinados." data-i18n-attr="content:description" />
    <meta name="theme-color" content="#0f0e0c" />
    <link rel="icon" href="assets/favicon.svg" type="image/svg+xml" />

    <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@100..900&family=JetBrains+Mono:wght@400..600&display=swap" />

    <script>
      // aplica tema, idioma, barra de rolagem e estado da sidebar antes do primeiro paint (sem "piscar")
      document.documentElement.setAttribute('data-ds-scrollbars', '');
      try {
        var t = localStorage.getItem('ds-theme');
        if (t === 'light' || t === 'dark' || t === 'refugio' || t === 'system') document.documentElement.dataset.theme = t;
      } catch (e) {}
      try {
        var l = null;
        try { l = localStorage.getItem('ds-locale'); } catch (e) {}
        if (l !== 'pt-BR' && l !== 'en' && l !== 'es') {
          l = 'en';
          var langs = navigator.languages && navigator.languages.length ? navigator.languages : [navigator.language];
          for (var i = 0; i < langs.length; i++) {
            var x = String(langs[i]).toLowerCase();
            if (x.indexOf('pt') === 0) { l = 'pt-BR'; break; }
            if (x.indexOf('es') === 0) { l = 'es'; break; }
            if (x.indexOf('en') === 0) { l = 'en'; break; }
          }
        }
        document.documentElement.lang = l;
      } catch (e) {}
    </script>

    <style>
      /* Geist Serif (Vercel, OFL) nos títulos — ainda fora do Google Fonts; só existe o peso Regular.
         A Geist Sans, do texto, vem do Google Fonts acima. */
      @font-face {
        font-family: 'Geist Serif';
        src: url('https://cdn.jsdelivr.net/npm/geist@1.9.0/dist/fonts/geist-serif/GeistSerif-Regular.woff2') format('woff2');
        font-weight: 400;
        font-style: normal;
        font-display: swap;
      }
    </style>
    <link rel="stylesheet" href="ds/ds.css" />
    <link rel="stylesheet" href="site/site.css" />
    <link rel="stylesheet" href="site/docs.css" />
    <script type="module" src="site/app.js"></script>
  </head>
  <body>
    <a class="ds-skip-link" href="#conteudo" data-skip-link data-i18n="skip">Pular para o conteúdo</a>

    <div class="ds-shell" id="shell">
      <script>
        try {
          var s = JSON.parse(localStorage.getItem('ds-sidebar'));
          if (s) document.getElementById('shell').dataset.sidebar = s;
          var ly = JSON.parse(localStorage.getItem('ds-layout'));
          if (ly === 'navbar' || ly === 'sidebar') document.getElementById('shell').dataset.layout = ly;
        } catch (e) {}
      </script>

      <button type="button" class="ds-shell__edge" data-shell-toggle aria-controls="sidebar" data-ds-tooltip-placement="right"><ds-icon name="chevron-left" size="16"></ds-icon></button>

      <div class="ds-navbar">
        <a class="ds-brand" href="#/" aria-label="Lume, ir para o início" data-i18n-attr="aria-label:goHome"><img class="ds-brand__mark" src="assets/favicon.svg" alt="" width="24" height="24" /><svg class="ds-brand__type" viewBox="-1 27 252 75" fill="currentColor" aria-hidden="true"><path d="M0 28H25V31.5H19.5V96H45.5L49.5 85H51V100H0V96.5H6V31.5H0Z"/><path d="M51 48H69V80C69 89.5 73.5 95.5 80.5 95.5C86 95.5 90 92 92 87V51.5H87V48H105V96.5H110V100H92V93C89 97.5 84.5 100.5 78.5 100.5C68 100.5 56 94 56 80V51.5H51Z" transform="translate(3 0)"/><path d="M118 48h13v52h-13zM113 48h18v3.5h-18zM131 58C134 51 139 47.5 145 47.5C154 47.5 160 53 160 62V100H147V64C147 57 144.5 53 140 53C136.5 53 133 55.5 131 60ZM160 58C163 51 168 47.5 174 47.5C183 47.5 189 53 189 62V100H176V64C176 57 173.5 53 169 53C165.5 53 162 55.5 160 60ZM113.5 96.5h22v3.5h-22zM142.5 96.5h22v3.5h-22zM171.5 96.5h22v3.5h-22z" transform="translate(5 0)"/><path fill-rule="evenodd" d="M241.5 73.5C241.5 58 232 47.5 219 47.5C205 47.5 196.5 59 196.5 74.5C196.5 90 206 100.5 220 100.5C230 100.5 237.5 95 241 87L238.5 86C235 92 229.5 95.5 222.5 95.5C214 95.5 209 89 209 76V73.5ZM209.2 70C210 58 214 52.5 219.5 52.5C225.5 52.5 228.5 58 228.5 70Z" transform="translate(8 0)"/></svg></a>
        <nav class="ds-navbar__nav" id="navbar-nav" aria-label="Principal" data-i18n-attr="aria-label:mainNav"></nav>
        <button type="button" class="ds-field ds-sidebar-search ds-navbar__search" data-command-open aria-keyshortcuts="Meta+K Control+K">
          <ds-icon name="search" size="20"></ds-icon>
          <span class="ds-field__placeholder" data-i18n="searchLume">Buscar no Lume</span>
          <span class="ds-sidebar-search__kbd" aria-hidden="true"><kbd class="ds-kbd" data-kbd-mod>⌘</kbd><kbd class="ds-kbd">K</kbd></span>
        </button>
      </div>

      <aside class="ds-sidebar" id="sidebar" aria-label="Barra lateral" data-i18n-attr="aria-label:sidebar">
        <div class="ds-sidebar__header">
          <a class="ds-brand" href="#/" aria-label="Lume, ir para o início" data-i18n-attr="aria-label:goHome"><img class="ds-brand__mark" src="assets/favicon.svg" alt="" width="24" height="24" /><svg class="ds-brand__type" viewBox="-1 27 252 75" fill="currentColor" aria-hidden="true"><path d="M0 28H25V31.5H19.5V96H45.5L49.5 85H51V100H0V96.5H6V31.5H0Z"/><path d="M51 48H69V80C69 89.5 73.5 95.5 80.5 95.5C86 95.5 90 92 92 87V51.5H87V48H105V96.5H110V100H92V93C89 97.5 84.5 100.5 78.5 100.5C68 100.5 56 94 56 80V51.5H51Z" transform="translate(3 0)"/><path d="M118 48h13v52h-13zM113 48h18v3.5h-18zM131 58C134 51 139 47.5 145 47.5C154 47.5 160 53 160 62V100H147V64C147 57 144.5 53 140 53C136.5 53 133 55.5 131 60ZM160 58C163 51 168 47.5 174 47.5C183 47.5 189 53 189 62V100H176V64C176 57 173.5 53 169 53C165.5 53 162 55.5 160 60ZM113.5 96.5h22v3.5h-22zM142.5 96.5h22v3.5h-22zM171.5 96.5h22v3.5h-22z" transform="translate(5 0)"/><path fill-rule="evenodd" d="M241.5 73.5C241.5 58 232 47.5 219 47.5C205 47.5 196.5 59 196.5 74.5C196.5 90 206 100.5 220 100.5C230 100.5 237.5 95 241 87L238.5 86C235 92 229.5 95.5 222.5 95.5C214 95.5 209 89 209 76V73.5ZM209.2 70C210 58 214 52.5 219.5 52.5C225.5 52.5 228.5 58 228.5 70Z" transform="translate(8 0)"/></svg></a>
          <button type="button" class="ds-icon-btn ds-icon-btn--outline ds-icon-btn--lg ds-sidebar__toggle" data-shell-toggle aria-controls="sidebar" data-ds-tooltip-placement="right">
            <img class="ds-sidebar__toggle-mark" src="assets/favicon.svg" alt="" width="28" height="28" />
            <ds-icon name="panel-left" class="ds-sidebar__toggle-collapse"></ds-icon>
            <ds-icon name="x" class="ds-sidebar__toggle-close"></ds-icon>
          </button>
        </div>

        <div class="ds-sidebar__search">
          <button type="button" class="ds-field ds-sidebar-search" data-command-open data-ds-tooltip="Buscar" data-i18n-attr="data-ds-tooltip:search" data-ds-tooltip-placement="right" aria-keyshortcuts="Meta+K Control+K">
            <ds-icon name="search" size="20"></ds-icon>
            <span class="ds-field__placeholder" data-i18n="searchLume">Buscar no Lume</span>
            <span class="ds-sidebar-search__kbd" aria-hidden="true"><kbd class="ds-kbd" data-kbd-mod>⌘</kbd><kbd class="ds-kbd">K</kbd></span>
          </button>
        </div>

        <nav class="ds-sidebar__nav" id="sidebar-nav" aria-label="Principal" data-i18n-attr="aria-label:mainNav"></nav>

        <div class="ds-sidebar__footer">
          <a class="ds-account" href="#/novidades" data-ds-tooltip="Lume 0.2 · novidades" data-ds-tooltip-placement="right">
            <span class="ds-avatar"><ds-icon name="package" size="20"></ds-icon></span>
            <span class="ds-account__text">
              <span class="ds-account__title">Lume 0.2</span>
              <span class="ds-account__subtitle" data-i18n="whatsNew">Ver o que há de novo</span>
            </span>
            <ds-icon name="chevron-right" class="ds-account__chevron"></ds-icon>
          </a>
        </div>
      </aside>

      <div class="ds-shell__scrim" data-shell-scrim></div>

      <div class="ds-main">
        <div class="ds-main__scroll" id="main-scroll">
          <header class="ds-topbar">
            <button type="button" class="ds-icon-btn ds-icon-btn--outline ds-topbar__menu" data-shell-toggle aria-controls="sidebar">
              <ds-icon name="menu"></ds-icon>
            </button>
            <nav class="ds-breadcrumb" id="breadcrumb" aria-label="Você está em" data-i18n-attr="aria-label:youAreHere"></nav>
            <div class="ds-topbar__spacer"></div>
            <button type="button" class="ds-icon-btn ds-topbar__search" data-command-open aria-label="Buscar" data-i18n-attr="aria-label:search">
              <ds-icon name="search"></ds-icon>
            </button>
            <div class="ds-segmented ds-topbar__layout" role="radiogroup" aria-label="Layout" data-i18n-attr="aria-label:layout">
              <button type="button" class="ds-segmented__item" role="radio" data-layout-option="sidebar" aria-label="Sidebar" data-ds-tooltip="Navegação na lateral" data-i18n-attr="aria-label:layoutSidebar; data-ds-tooltip:layoutSidebarTip" data-ds-tooltip-placement="bottom"><ds-icon name="panel-left" size="16"></ds-icon></button>
              <button type="button" class="ds-segmented__item" role="radio" data-layout-option="navbar" aria-label="Navbar" data-ds-tooltip="Navegação no topo" data-i18n-attr="aria-label:layoutNavbar; data-ds-tooltip:layoutNavbarTip" data-ds-tooltip-placement="bottom"><ds-icon name="panel-top" size="16"></ds-icon></button>
            </div>
            <button type="button" class="ds-chip ds-chip--sm ds-topbar__locale" data-locale-menu data-i18n-attr="data-ds-tooltip:language" data-ds-tooltip="Idioma" data-ds-tooltip-placement="bottom">
              <span class="ds-chip__icon"><ds-icon name="globe" size="14"></ds-icon></span><span data-label>PT</span><span class="ds-chip__chevron"><ds-icon name="chevron-down" size="14"></ds-icon></span>
            </button>
            <div class="ds-segmented" role="radiogroup" aria-label="Tema" data-i18n-attr="aria-label:theme">
              <button type="button" class="ds-segmented__item" role="radio" data-theme-option="dark" aria-label="Escuro" data-ds-tooltip="Tema escuro" data-i18n-attr="aria-label:dark; data-ds-tooltip:darkTheme" data-ds-tooltip-placement="bottom"><ds-icon name="moon" size="16"></ds-icon></button>
              <button type="button" class="ds-segmented__item" role="radio" data-theme-option="light" aria-label="Claro" data-ds-tooltip="Tema claro" data-i18n-attr="aria-label:light; data-ds-tooltip:lightTheme" data-ds-tooltip-placement="bottom"><ds-icon name="sun" size="16"></ds-icon></button>
              <button type="button" class="ds-segmented__item" role="radio" data-theme-option="refugio" aria-label="Refúgio" data-ds-tooltip="Tema Refúgio" data-i18n-attr="aria-label:refugio; data-ds-tooltip:refugioTheme" data-ds-tooltip-placement="bottom"><ds-icon name="mountain" size="16"></ds-icon></button>
              <button type="button" class="ds-segmented__item" role="radio" data-theme-option="system" aria-label="Sistema" data-ds-tooltip="Seguir o sistema" data-i18n-attr="aria-label:system; data-ds-tooltip:followSystem" data-ds-tooltip-placement="bottom"><ds-icon name="monitor" size="16"></ds-icon></button>
            </div>
          </header>

          <main id="conteudo" class="ds-main__content" tabindex="-1"></main>
        </div>
      </div>
    </div>
  </body>
</html>
