<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<style>
  :root {
    --bg: var(--figma-color-bg, #1e1e1e);
    --fg: var(--figma-color-text, #f3ede5);
    --muted: var(--figma-color-text-secondary, #9c9792);
    --line: var(--figma-color-border, #3d3b38);
    --brand: #ff945e;
    --on-brand: #451400;
  }
  * { box-sizing: border-box; margin: 0; }
  body { padding: 20px; background: var(--bg); color: var(--fg); font: 400 12px/1.5 Inter, system-ui, sans-serif; }
  .eyebrow { color: var(--brand); font-weight: 600; font-size: 11px; letter-spacing: .08em; text-transform: uppercase; }
  h1 { margin-top: 6px; font: 600 20px/1.2 "Inter Tight", Inter, sans-serif; letter-spacing: -.02em; }
  p.lead { margin-top: 8px; color: var(--muted); }
  fieldset { margin-top: 18px; padding: 0; border: 0; display: grid; gap: 8px; }
  legend { margin-bottom: 8px; color: var(--muted); font-weight: 500; }
  label.opt { display: grid; grid-template-columns: 18px 1fr; gap: 10px; align-items: start; padding: 10px 12px; border: 1px solid var(--line); border-radius: 12px; cursor: pointer; }
  label.opt strong { display: block; font-weight: 600; }
  label.opt span span { color: var(--muted); }
  input[type="checkbox"] { width: 16px; height: 16px; margin: 1px 0 0; accent-color: var(--brand); }
  .seg { display: grid; grid-template-columns: repeat(3, 1fr); gap: 4px; padding: 4px; border: 1px solid var(--line); border-radius: 12px; }
  .seg label { position: relative; display: grid; cursor: pointer; }
  .seg input { position: absolute; inset: 0; width: 100%; height: 100%; margin: 0; opacity: 0; cursor: pointer; }
  .seg span { display: grid; place-items: center; height: 30px; border-radius: 8px; color: var(--muted); font-weight: 500; }
  .seg input:checked + span { background: var(--figma-color-bg-secondary, #2c2a27); color: var(--fg); }
  .seg input:focus-visible + span { outline: 2px solid var(--brand); outline-offset: 1px; }
  .hint { color: var(--muted); }
  .actions { display: flex; gap: 8px; margin-top: 18px; }
  button { flex: 1; height: 36px; border-radius: 10px; border: 1px solid var(--line); background: transparent; color: var(--fg); font: 500 12px Inter, sans-serif; cursor: pointer; }
  button.primary { border: 0; background: var(--brand); color: var(--on-brand); font-weight: 600; }
  button:disabled { opacity: .5; cursor: default; }
  .log { margin-top: 16px; min-height: 40px; padding: 10px 12px; border-radius: 12px; background: var(--figma-color-bg-secondary, #2c2a27); color: var(--muted); }
  .log[data-tone="done"] { color: var(--fg); }
  .log[data-tone="error"] { color: #ff9087; }
</style>
</head>
<body>
  <p class="eyebrow">Órbita Design System</p>
  <h1>Gerar a biblioteca</h1>
  <p class="lead">Cria ou atualiza variáveis, estilos e componentes neste arquivo. Rodar de novo atualiza sem duplicar — instâncias que você já usou continuam ligadas.</p>

  <fieldset>
    <legend>O que gerar</legend>
    <label class="opt"><input type="checkbox" value="Fundamentos" checked><span><strong>Fundamentos</strong><span>Cores, tipografia, espaço, raio e sombra</span></span></label>
    <label class="opt"><input type="checkbox" value="Ícones" checked><span><strong>Ícones</strong><span>Todos os ícones como componentes de 24 px</span></span></label>
    <label class="opt"><input type="checkbox" value="Componentes" checked><span><strong>Componentes</strong><span>Blocos com variantes, exemplos e prévias em cada modo</span></span></label>
  </fieldset>

  <fieldset>
    <legend>Modos</legend>
    <div class="seg">
      <label><input type="radio" name="modes" value="Claro,Escuro" checked><span>Claro e Escuro</span></label>
      <label><input type="radio" name="modes" value="Escuro"><span>Só Escuro</span></label>
      <label><input type="radio" name="modes" value="Claro"><span>Só Claro</span></label>
    </div>
    <p class="hint" data-hint></p>
  </fieldset>

  <div class="actions">
    <button type="button" data-cancel>Fechar</button>
    <button type="button" class="primary" data-run>Gerar no arquivo</button>
  </div>
  <p class="log" data-log aria-live="polite">Variáveis e estilos de texto são sempre atualizados.</p>

<script>
  const log = document.querySelector('[data-log]');
  const run = document.querySelector('[data-run]');
  const hint = document.querySelector('[data-hint]');
  const modeInputs = [...document.querySelectorAll('input[name="modes"]')];
  const chosenModes = () => modeInputs.find((i) => i.checked).value.split(',');
  const showHint = () => {
    hint.textContent = chosenModes().length > 1
      ? 'Precisa de plano pago no Figma: o gratuito aceita um modo só por coleção.'
      : 'Funciona em qualquer plano. Para ter os dois depois, rode de novo com Claro e Escuro: o que já existe é atualizado.';
  };
  modeInputs.forEach((i) => i.addEventListener('change', showHint));
  showHint();

  run.addEventListener('click', () => {
    const pages = [...document.querySelectorAll('input[type="checkbox"]:checked')].map((i) => i.value);
    run.disabled = true;
    log.dataset.tone = '';
    log.textContent = 'Começando…';
    parent.postMessage({ pluginMessage: { type: 'run', pages, modes: chosenModes() } }, '*');
  });
  document.querySelector('[data-cancel]').addEventListener('click', () => parent.postMessage({ pluginMessage: { type: 'cancel' } }, '*'));
  onmessage = (event) => {
    const msg = event.data.pluginMessage;
    if (!msg) return;
    if (msg.type === 'init') {
      const saved = modeInputs.find((i) => i.value === msg.modes.join(','));
      if (saved) saved.checked = true;
      showHint();
      return;
    }
    log.textContent = msg.message;
    if (msg.type === 'done' || msg.type === 'error') {
      log.dataset.tone = msg.type;
      run.disabled = false;
      run.textContent = 'Gerar de novo';
    }
  };
</script>
</body>
</html>
